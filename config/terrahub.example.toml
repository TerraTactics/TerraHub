# TerraHub example configuration (copy to /etc/terrahub/config.toml on device)

[hub]
# Stable gateway identity (factory or first-boot generated)
identity = "GW-DEV00001"
# Routing address assigned to this hub on the TerraLink mesh
routing_addr = 1

[radio]
# Transport:
#   "stub"       — in-memory (default; no serial hardware)
#   "loopback"   — UART framing over an in-memory pipe (tests / bring-up)
#   "uart"       — real UART / USB-serial to LoRa coprocessor
#   "usb-serial" — alias for "uart"
backend = "stub"
# Linux examples: "/dev/ttyUSB0", "/dev/ttyAMA0", "/dev/serial0"
# Windows example: "COM3"
# device = "/dev/ttyUSB0"
# baud = 115200

[buffer]
sqlite_path = "data/terrahub.db"

[cloud]
# MQTT placeholder — TerraTactics cloud broker details applied after pairing
enabled = false
# broker_url = "mqtts://mqtt.terratactics.example:8883"
# client_id = "GW-DEV00001"

[admin]
# Local setup wizard only (not day-to-day farm ops)
bind = "127.0.0.1:8080"
